name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck + lint + unit/integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: resellix_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ci:ci_only_password@127.0.0.1:5432/resellix_ci?schema=public
      DIRECT_URL: postgresql://ci:ci_only_password@127.0.0.1:5432/resellix_ci?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # .env.test is gitignored, so synthesize it for the integration suite.
      - name: Write .env.test
        run: |
          cat > .env.test <<'EOF'
          NODE_ENV=test
          APP_URL=http://127.0.0.1:3100
          APP_NAME=CI Test
          DATABASE_URL=postgresql://ci:ci_only_password@127.0.0.1:5432/resellix_ci?schema=public
          DIRECT_URL=postgresql://ci:ci_only_password@127.0.0.1:5432/resellix_ci?schema=public
          SESSION_TTL_DAYS=30
          PASSWORD_RESET_TTL_MINUTES=60
          PAYMENTS_TEST_MODE=true
          SUPPLIER_DEMO_MODE=true
          SUPPLIER_WEBHOOK_SECRET=ci_supplier_webhook_secret
          CRON_SECRET=ci_cron_secret
          EMAIL_PROVIDER=console
          EMAIL_FROM="CI Test <no-reply@ci.test>"
          EOF

      - name: Apply migrations to CI database
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit + integration tests (134)
        run: npm test

      # E2E (npm run test:e2e, 62 tests) intentionally NOT run here: it needs a
      # live dev server with seeded demo catalog and stays within the app's own
      # rate limits. It is run locally against `npm run dev -- --turbopack -p 3100`.
